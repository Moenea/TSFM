    seq_len: 768
    pred_len: 96
    result_dir: "zeroshot_ZJSH_PI10102TS_S_DIFF"
  - name: "Timer-XL-Zeroshot-MS"
    seq_len: 768
    pred_len: 96
    result_dir: "zeroshot_ZJSH_PI10102TS_MS_DIFF"
  - name: "Timer-XL-S"
    seq_len: 768
    pred_len: 96
    result_dir: "forecast_ZJSH_PI10102TS_S_full_shot_DIFF_timer_xl_MultivariateDatasetYAMLSplit_sl768_it96_ot96_lr5e-06_bt32_wd0_el8_dm1024_dff2048_nh8_cosTrue_test_0"
  - name: "Timer-XL-MS"
    seq_len: 768
    pred_len: 96
    result_dir: "forecast_ZJSH_PI10102TS_MS_full_shot_DIFF_timer_xl_MultivariateDatasetYAMLSplit_sl768_it96_ot96_lr5e-06_bt32_wd0_el8_dm1024_dff2048_nh8_cosTrue_test_0"
