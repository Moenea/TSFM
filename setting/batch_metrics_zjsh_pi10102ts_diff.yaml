# Batch metrics config for ZJSH 2103 PI10102 FIRST-ORDER DIFF models.
#
# The models are trained on `2103ts_diff/`, but run.py is invoked with
# `--restore_diff_to_raw`: it stores the raw differenced forecasts as
# pred_diff.npy / true_diff.npy and replaces pred.npy / true.npy with
# reconstructed raw PI10102 values. Therefore this config evaluates the DIFF
# models in the same raw PI10102 space, with the same raw alarm limits, as the
# original batch_metrics_zjsh_pi10102ts.yaml pipeline.

params:
  target: "PI10102"
  limit_csv_path: "/home/aicode/sherwin/TSFM/setting/limits_zjsh.csv"
  data_root: "/home/aicode/sherwin/dataset/ZJSH"
  results_root: "./results"
  split_file: "setting/ZJSH_PI10102ts.yaml"
  alarm_quality_rmse_factor: 0.01
  eval_steps: 15
  input_clean_steps: 30
  align_eval_to:
    seq_len: 768
    pred_len: 96

# Each entry may override seq_len/pred_len. Timer-XL: 768/96. Baselines: 30/15.
model_dirs:
  # ----- Timer-XL (long-context, zero-shot / full-shot / partial15) -----
